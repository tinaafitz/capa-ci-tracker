apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: capa-ci-tracker
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: frontend
      containers:
        - name: oauth-proxy
          image: registry.redhat.io/openshift4/ose-oauth-proxy:v4.14
          ports:
            - containerPort: 4180
              name: proxy
              protocol: TCP
          args:
            - --https-address=
            - --http-address=:4180
            - --upstream=http://localhost:8080
            - --provider=openshift
            - --openshift-service-account=frontend
            - --cookie-secret=CHANGEME_GENERATE_WITH_openssl_rand_base64_32
            - --cookie-secure=false
            - --email-domain=*
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: nginx
          image: image-registry.openshift-image-registry.svc:5000/capa-ci-tracker/frontend:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
