apiVersion: apps/v1
kind: Deployment
metadata:
  name: capa-ci-tracker
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: capa-ci-tracker
    app.kubernetes.io/part-of: capa-ci-tracker
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite is single-writer; avoid two pods mounting the PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: capa-ci-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capa-ci-tracker
        app.kubernetes.io/part-of: capa-ci-tracker
    spec:
      serviceAccountName: capa-ci-tracker
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: capa-ci-tracker
          image: ghcr.io/tinaafitz/capa-ci-tracker:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: capa-ci-tracker-config
            - secretRef:
                name: capa-ci-tracker-env
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/builds
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/builds
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: capa-ci-tracker-data
