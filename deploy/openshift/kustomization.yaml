apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: capa-ci-tracker

# Resources listed in dependency order:
# 1. Namespace
# 2. ServiceAccount (needed by frontend Deployment)
# 3. Secrets (needed by all workloads)
# 4. ConfigMaps (needed by all workloads)
# 5. Postgres StatefulSet + Service (database must be up first)
# 6. PostgREST Deployment + Service (depends on postgres)
# 7. Frontend Deployment + Service (depends on postgrest)
# 8. CronJobs (depend on postgres and api-tokens)
# 9. Route (depends on frontend Service)
resources:
  - namespace.yaml
  - serviceaccount-frontend.yaml
  - secret-db-credentials.yaml
  - secret-api-tokens.yaml
  - configmap-postgres-init.yaml
  - configmap-postgrest.yaml
  - configmap-app.yaml
  - configmap-nginx.yaml
  - statefulset-postgres.yaml
  - service-postgres.yaml
  - deployment-postgrest.yaml
  - service-postgrest.yaml
  - deployment-frontend.yaml
  - service-frontend.yaml
  - cronjob-ingest-jenkins.yaml
  - cronjob-ingest-prow.yaml
  - cronjob-resolution-tracker.yaml
  - cronjob-streak-analyzer.yaml
  - cronjob-retention-cleanup.yaml
  - cronjob-morning-digest.yaml
  - route-frontend.yaml

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
