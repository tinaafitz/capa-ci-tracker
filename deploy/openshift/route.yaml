apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: capa-ci-tracker
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: capa-ci-tracker
    app.kubernetes.io/part-of: capa-ci-tracker
spec:
  # host is left blank -- OpenShift assigns <name>-<namespace>.apps.<cluster>
  to:
    kind: Service
    name: capa-ci-tracker
    weight: 100
  port:
    targetPort: 3001
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
