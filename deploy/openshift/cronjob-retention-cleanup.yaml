apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention-cleanup
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: retention-cleanup
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: jobs
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retention-cleanup
            app.kubernetes.io/part-of: capa-ci-tracker
            app.kubernetes.io/component: jobs
        spec:
          restartPolicy: OnFailure
          containers:
            - name: retention-cleanup
              image: image-registry.openshift-image-registry.svc:5000/capa-ci-tracker/jobs:latest
              command:
                - node
                - --import
                - tsx
                - jobs/retention-cleanup.ts
              envFrom:
                - configMapRef:
                    name: app-config
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_DB
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
