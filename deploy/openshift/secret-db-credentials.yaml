apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: capa_ci_tracker
  POSTGRES_USER: app_user
  # Replace with a strong generated password before deploying.
  # Example: openssl rand -base64 24
  POSTGRES_PASSWORD: "CHANGEME"
  PGRST_DB_URI: "postgresql://app_user:CHANGEME@postgres:5432/capa_ci_tracker"
