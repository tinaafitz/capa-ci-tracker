apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-prow
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: ingest-prow
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: jobs
spec:
  schedule: "2-59/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingest-prow
            app.kubernetes.io/part-of: capa-ci-tracker
            app.kubernetes.io/component: jobs
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest-prow
              image: image-registry.openshift-image-registry.svc:5000/capa-ci-tracker/jobs:latest
              command:
                - node
                - --import
                - tsx
                - jobs/ingest.ts
                - --source=prow
              envFrom:
                - configMapRef:
                    name: app-config
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_DB
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-tokens
                      key: SLACK_WEBHOOK_URL
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
