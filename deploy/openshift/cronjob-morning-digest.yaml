apiVersion: batch/v1
kind: CronJob
metadata:
  name: morning-digest
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: morning-digest
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: jobs
spec:
  schedule: "0 13 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: morning-digest
            app.kubernetes.io/part-of: capa-ci-tracker
            app.kubernetes.io/component: jobs
        spec:
          restartPolicy: OnFailure
          containers:
            - name: morning-digest
              image: image-registry.openshift-image-registry.svc:5000/capa-ci-tracker/jobs:latest
              command:
                - node
                - --import
                - tsx
                - jobs/morning-digest.ts
              envFrom:
                - configMapRef:
                    name: app-config
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: db-credentials
                      key: POSTGRES_DB
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-tokens
                      key: SLACK_WEBHOOK_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
