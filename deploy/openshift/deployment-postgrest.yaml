apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: postgrest
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: postgrest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgrest
        app.kubernetes.io/part-of: capa-ci-tracker
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.2.3
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: PGRST_DB_URI
          envFrom:
            - configMapRef:
                name: postgrest-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
