apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: frontend
spec:
  # Replace CLUSTER_DOMAIN with your cluster's apps domain.
  # Example: capa-ci-tracker.apps.ocp4.example.com
  host: capa-ci-tracker.apps.CLUSTER_DOMAIN
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: proxy
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
