apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: database
data:
  01-roles.sql: |
    -- PostgREST roles for API access.
    -- These run after the main database is created by the postgres entrypoint.
    CREATE ROLE postgrest_anon NOLOGIN;
    CREATE ROLE app_user NOLOGIN;
    GRANT app_user TO postgrest_anon;
    GRANT USAGE ON SCHEMA public TO postgrest_anon, app_user;
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO app_user;
