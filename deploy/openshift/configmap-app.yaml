apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: capa-ci-tracker
  labels:
    app.kubernetes.io/part-of: capa-ci-tracker
    app.kubernetes.io/component: jobs
data:
  JENKINS_BASE_URL: "https://jenkins-csb-rhacm-tests.dno.corp.redhat.com/job/CI-Jobs/job/capi_tests"
  PROW_API_URL: "https://prow.ci.openshift.org"
  # Comma-separated list of Jenkins job names to ingest
  JENKINS_JOBS: "rosa-hcp-e2e,rosa-hcp-upgrade,capa-e2e,capa-conformance"
  # Comma-separated list of Prow job names to ingest
  PROW_JOBS: "periodic-ci-openshift-cluster-api-provider-aws-main-e2e,periodic-ci-openshift-cluster-api-provider-aws-main-unit"
  # Database connection details for CronJobs (host and port, credentials come from Secret)
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "capa_ci_tracker"
