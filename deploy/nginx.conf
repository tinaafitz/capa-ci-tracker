# nginx.conf -- Default configuration for the frontend container.
#
# This file is baked into the image as a fallback for local testing.
# On OpenShift, the configmap-nginx.yaml ConfigMap is mounted at
# /etc/nginx/conf.d/ and overrides the server block. However, the
# top-level directives (worker_processes, pid, temp paths) come from
# this file since the ConfigMap only provides a server {} snippet.
#
# OpenShift constraint: containers run as an arbitrary non-root UID,
# so all writable paths (pid, temp dirs) must be under /tmp.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Temp directories must be writable by arbitrary UID.
    # /tmp is world-writable on all Linux systems.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Log to stdout/stderr so OCP log collectors (Fluentd, Vector) pick them up.
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;
        server_name _;

        # Serve the React SPA. try_files falls back to index.html so
        # client-side routing (react-router-dom) works on page refresh.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively. Vite hashes filenames,
            # so immutable caching is safe -- new deploys produce new hashes.
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Reverse proxy to PostgREST. The trailing slash on proxy_pass
        # strips the /api/ prefix: /api/builds -> postgrest:3000/builds.
        location /api/ {
            proxy_pass http://postgrest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint for readiness/liveness probes.
        location /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
