name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  server:
    name: Server Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify server starts and responds
        run: |
          node dist/index.js &
          SERVER_PID=$!
          # Wait for server to be ready
          for i in $(seq 1 15); do
            if curl -s http://localhost:3001/api/builds > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          # Verify the API responds with HTTP 200
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/builds)
          kill $SERVER_PID 2>/dev/null || true
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Server health check failed — GET /api/builds returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Server health check passed (HTTP $HTTP_CODE)"
