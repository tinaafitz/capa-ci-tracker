name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Container
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      # Deployment target is now a Docker container running Node.js + SQLite.
      # Configure the registry URL and credentials below to push to your
      # container registry (e.g., quay.io, GHCR, or an internal OpenShift registry).
      #
      # Required secrets:
      #   CONTAINER_REGISTRY     — registry host (e.g., quay.io/myorg)
      #   CONTAINER_REGISTRY_USER
      #   CONTAINER_REGISTRY_PASSWORD
      #
      # For a simple non-container deployment (e.g., a VM or bare-metal host),
      # replace this job with an rsync/scp step that copies the built artifacts.

      - name: Build Docker image
        run: |
          docker build -t capa-ci-tracker:${{ github.sha }} .
          docker tag capa-ci-tracker:${{ github.sha }} capa-ci-tracker:latest

      # Uncomment and configure when a container registry is available:
