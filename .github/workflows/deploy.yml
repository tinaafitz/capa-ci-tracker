      # - name: Log in to container registry
      #   run: |
      #     echo "${{ secrets.CONTAINER_REGISTRY_PASSWORD }}" | \
      #       docker login "${{ secrets.CONTAINER_REGISTRY }}" \
      #         -u "${{ secrets.CONTAINER_REGISTRY_USER }}" --password-stdin
